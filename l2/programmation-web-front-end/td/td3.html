<!-- ═══ Apply saved theme before paint (no flash) ═══ -->
<script>
  (function () {
    var t = localStorage.getItem('theme') || 'dark';
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>

<style>
  /* ═══════════════════════════════════════════════════════════
     DARK MODE = DEFAULT  (matching your theme script)
     LIGHT MODE = html[data-theme="light"]
     ═══════════════════════════════════════════════════════════ */
  :root{
    /* Dark palette (default) */
    --sl-primary:#8bc34a;
    --sl-primary-dark:#aed581;
    --sl-primary-soft:#1a2e15;
    --sl-accent:#aed581;
    --sl-heading:#f0f0f0;
    --sl-text:#c8c8c8;
    --sl-muted:#8a8a8a;
    --sl-bg:#0f1115;
    --sl-surface:#1a1d23;
    --sl-surface-2:#22262e;
    --sl-border:#2f333b;
    --sl-tag:#25292f;
    --sl-code-bg:#0d0f12;
    --sl-code-text:#d4d4d4;
    --sl-correct-bg:#0f2e1a;
    --sl-wrong-bg:#2e0f0f;
    --sl-shadow:0 4px 20px rgba(0,0,0,.35);

    --sl-font-heading:'Segoe UI',system-ui,-apple-system,sans-serif;
    --sl-font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --sl-font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  html[data-theme="light"],
  body[data-theme="light"]{
    --sl-primary:#7cb342;
    --sl-primary-dark:#558b2f;
    --sl-primary-soft:#f1f8e9;
    --sl-accent:#a4c639;
    --sl-heading:#1a1a1a;
    --sl-text:#424242;
    --sl-muted:#757575;
    --sl-bg:#f5f5f5;
    --sl-surface:#ffffff;
    --sl-surface-2:#ffffff;
    --sl-border:#e8e8e8;
    --sl-tag:#f5f5f5;
    --sl-code-bg:#1e1e1e;
    --sl-code-text:#d4d4d4;
    --sl-correct-bg:#f0fdf4;
    --sl-wrong-bg:#fef2f2;
    --sl-shadow:0 4px 20px rgba(0,0,0,.06);
  }

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:var(--sl-font-body);background:var(--sl-bg);color:var(--sl-text);
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
    transition:background-color .2s ease, color .2s ease;
  }

  /* ═══════════════════════════════════════════════════════════
     SITE NAVBAR  (your provided structure)
     ═══════════════════════════════════════════════════════════ */
  .navbar{
    flex:0 0 auto;background:var(--sl-surface);border-bottom:1px solid var(--sl-border);
    padding:0 20px;height:64px;display:flex;align-items:center;z-index:30;position:relative;
  }
  .nav-container{
    width:100%;max-width:1500px;margin:0 auto;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .nav-logo{
    display:flex;align-items:center;gap:10px;text-decoration:none;
    color:var(--sl-heading);font-weight:700;font-size:15px;min-width:0;
  }
  .nav-logo img{height:34px;width:auto;display:block;border-radius:6px;flex:0 0 auto}
  .nav-logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  .nav-menu{
    display:flex;align-items:center;gap:6px;list-style:none;margin:0;padding:0;
  }
  .nav-menu > li{position:relative}

  .nav-link,.dropbtn{
    display:flex;align-items:center;gap:5px;
    padding:8px 14px;font-size:14px;font-weight:600;
    color:var(--sl-text);text-decoration:none;border-radius:8px;
    transition:.15s;cursor:pointer;background:none;border:none;font-family:inherit;
  }
  .nav-link:hover,.dropbtn:hover{
    background:var(--sl-primary-soft);color:var(--sl-primary);
  }
  .arrow{font-size:10px;transition:transform .15s;line-height:1}
  .dropdown:hover .arrow{transform:rotate(180deg)}

  .dropdown-content{
    display:none;position:absolute;top:100%;left:0;min-width:240px;
    background:var(--sl-surface);border:1px solid var(--sl-border);
    border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);
    padding:6px;z-index:100;margin-top:8px;
  }
  .dropdown:hover .dropdown-content,
  .dropdown:focus-within .dropdown-content{display:block}
  .dropdown-content a{
    display:block;padding:9px 14px;font-size:13.5px;
    color:var(--sl-text);text-decoration:none;border-radius:6px;transition:.12s;
  }
  .dropdown-content a:hover{
    background:var(--sl-primary-soft);color:var(--sl-primary);
  }

  .theme-toggle{
    width:38px;height:38px;border-radius:9px;
    background:var(--sl-tag);border:1px solid var(--sl-border);
    color:var(--sl-heading);cursor:pointer;
    display:grid;place-items:center;transition:.15s;padding:0;margin-left:6px;
  }
  .theme-toggle:hover{
    background:var(--sl-primary-soft);border-color:var(--sl-primary);color:var(--sl-primary);
  }
  .theme-toggle svg{display:block}

  /* --- Hamburger button (hidden on desktop) --- */
  .nav-toggle{
    display:none;
    flex-direction:column;
    gap:5px;
    background:none;border:none;cursor:pointer;
    padding:8px;margin-left:8px;flex:0 0 auto;
  }
  .nav-toggle span{
    width:24px;height:3px;background:var(--sl-heading);
    border-radius:2px;transition:transform .25s, opacity .25s;
  }
  .nav-toggle[aria-expanded="true"] span:nth-child(1){transform:translateY(8px) rotate(45deg)}
  .nav-toggle[aria-expanded="true"] span:nth-child(2){opacity:0}
  .nav-toggle[aria-expanded="true"] span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

  /* ═══════════════════════════════════════════════════════════
     DECK TOOLBAR (existing)
     ═══════════════════════════════════════════════════════════ */
  .topbar{
    height:46px;flex:0 0 46px;display:flex;align-items:center;gap:12px;
    padding:0 20px;background:var(--sl-surface);border-bottom:1px solid var(--sl-border);z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--sl-heading);font-size:13px}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--sl-primary);box-shadow:0 0 0 3px var(--sl-primary-soft)}
  .spacer{flex:1}
  .counter{font-size:12px;color:var(--sl-muted);font-variant-numeric:tabular-nums;
    background:var(--sl-tag);border:1px solid var(--sl-border);padding:3px 10px;border-radius:999px}
  .icon-btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--sl-heading);
    background:var(--sl-surface);border:1px solid var(--sl-border);
    padding:5px 12px;border-radius:7px;cursor:pointer;transition:.15s}
  .icon-btn:hover{background:var(--sl-primary-soft);border-color:var(--sl-primary);color:var(--sl-primary-dark)}

  /* ═══════════════════════════════════════════════════════════
     STAGE / SLIDE
     ═══════════════════════════════════════════════════════════ */
  #stage{flex:1;min-height:0;display:flex;padding:14px 16px 6px}
  .slide{
    flex:1;min-width:0;min-height:0;background:var(--sl-surface);
    border-radius:6px;box-shadow:var(--sl-shadow);
    display:flex;flex-direction:column;overflow:hidden;position:relative;
    animation:fadeUp .25s ease both;
    transition:background-color .2s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .slide-body{padding:44px 56px 20px;overflow:auto;flex:1;min-height:0}
  .slide-body::-webkit-scrollbar,.canvas-wrap::-webkit-scrollbar,.codeblock::-webkit-scrollbar{width:8px;height:8px}
  .slide-body::-webkit-scrollbar-thumb,.codeblock::-webkit-scrollbar-thumb{background:var(--sl-border);border-radius:8px}

  .slide-footer{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:10px 40px 14px;font-size:11px;color:var(--sl-muted);
  }
  .slide-footer .pg{font-variant-numeric:tabular-nums}

  .s-title{align-items:center;justify-content:center;text-align:center;
    padding:60px 48px;gap:14px;flex:1;display:flex;flex-direction:column;
    background:radial-gradient(900px 400px at 50% -10%, var(--sl-primary-soft) 0%, transparent 65%), var(--sl-surface)}
  .s-title .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--sl-primary)}
  .s-title h1{margin:6px 0 0;font-family:var(--sl-font-heading);
    font-size:clamp(28px,4.4vw,54px);line-height:1.1;color:var(--sl-heading);font-weight:800;max-width:1000px}
  .s-title .sub{font-size:clamp(15px,1.5vw,19px);color:var(--sl-muted);max-width:820px;line-height:1.55;margin:2px 0 0}
  .s-title .meta{margin-top:22px;font-size:13px;color:var(--sl-muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .s-title .meta span{background:var(--sl-tag);border:1px solid var(--sl-border);padding:5px 12px;border-radius:999px}

  .s-chapter{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px 80px;gap:4px;position:relative;background:var(--sl-surface)}
  .s-chapter .chapter-num{font-family:var(--sl-font-heading);font-size:clamp(60px,10vw,140px);font-weight:800;
    color:var(--sl-primary);line-height:1;letter-spacing:-.04em;margin-bottom:8px}
  .s-chapter h2{margin:0;font-family:var(--sl-font-heading);font-size:clamp(30px,4.5vw,52px);
    font-weight:800;color:var(--sl-heading);letter-spacing:-.02em;line-height:1.1}
  .s-chapter p{margin:10px 0 0;font-size:clamp(16px,1.7vw,21px);color:var(--sl-muted);font-weight:400}
  .s-chapter::after{content:"";position:absolute;left:80px;bottom:80px;width:120px;height:5px;background:var(--sl-accent);border-radius:3px}

  .slide h2.title{font-family:var(--sl-font-heading);font-size:clamp(22px,2.6vw,32px);font-weight:800;color:var(--sl-heading);margin:0 0 10px}
  .rule{width:170px;height:5px;background:var(--sl-accent);border-radius:3px;margin:0 0 30px}

  ul.bullets{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px}
  ul.bullets > li{position:relative;padding-left:30px;font-size:clamp(15px,1.45vw,19px);line-height:1.65;color:var(--sl-text)}
  ul.bullets > li::before{content:"";position:absolute;left:4px;top:.62em;width:10px;height:10px;background:var(--sl-primary)}
  ul.bullets ul{margin:10px 0 0;padding-left:6px;list-style:none;display:flex;flex-direction:column;gap:8px}
  ul.bullets ul li{position:relative;padding-left:22px;color:var(--sl-muted);font-size:.94em}
  ul.bullets ul li::before{content:"";position:absolute;left:4px;top:.72em;width:7px;height:7px;border-radius:50%;border:2px solid var(--sl-primary)}

  code{font-family:var(--sl-font-mono);font-size:.88em;background:var(--sl-tag);
    border:1px solid var(--sl-border);border-radius:4px;padding:1px 6px;color:var(--sl-primary-dark);white-space:nowrap}
  .note{margin-top:28px;border-left:4px solid var(--sl-primary);background:var(--sl-primary-soft);
    padding:14px 18px;border-radius:0 8px 8px 0;font-size:15px;line-height:1.6;color:var(--sl-primary-dark)}
  .note::before{content:"💡 "}

  .codeblock{border-radius:8px;overflow:hidden;background:var(--sl-code-bg);display:flex;flex-direction:column;min-height:0}
  .code-head{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--sl-code-bg);border-bottom:1px solid #333;flex:0 0 auto}
  .code-head .lang{font-family:var(--sl-font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--sl-primary);font-weight:800}
  .code-head .label{font-size:11px;color:var(--sl-primary);margin-left:auto;font-weight:600;letter-spacing:.06em}
  .codeblock pre{margin:0;padding:14px 0;overflow:auto;flex:1;min-height:0;
    font-family:var(--sl-font-mono);font-size:13.5px;line-height:1.7;display:flex;flex-direction:column}
  .code-row{display:flex;gap:16px;padding:0 16px}
  .code-row .ln{color:#5a5a5a;user-select:none;text-align:right;min-width:24px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .code-row .lc{white-space:pre;color:var(--sl-code-text);flex:1}
  .codeblock pre::-webkit-scrollbar-thumb{background:#444}

  .tok-kw{color:#c586c0;font-weight:600}
  .tok-str{color:#ce9178}
  .tok-com{color:#6a9955;font-style:italic}
  .tok-num{color:#b5cea8}
  .tok-glob{color:#4ec9b0}
  .tok-tag{color:#569cd6}
  .tok-attr{color:#9cdcfe}

  .run-btn{margin-left:auto;font:inherit;font-size:12px;font-weight:700;color:#fff;background:var(--sl-primary);
    border:none;padding:5px 14px;border-radius:6px;cursor:pointer;transition:.15s}
  .run-btn:hover{background:var(--sl-primary-dark)}
  .run-out{margin:0;padding:12px 16px;background:#0d0d0d;border-top:1px solid #333;
    font-family:var(--sl-font-mono);font-size:13px;color:#b5cea8;
    max-height:130px;overflow:auto;white-space:pre-wrap;flex:0 0 auto}

  .canvas-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--sl-surface)}
  .canvas-stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;
    margin-left:-640px;margin-top:-360px;transform-origin:center center;background:var(--sl-surface)}
  .cv-heading{font-family:var(--sl-font-heading);font-weight:800;color:var(--sl-heading);line-height:1.2}
  .cv-shape{border-radius:0}
  .cv-text{overflow:auto}
  .cv-text p{margin:0 0 10px}
  .cv-text ul{margin:8px 0;padding-left:22px}
  .cv-text li{margin-bottom:7px}
  .cv-text pre{white-space:pre-wrap}
  .cv-highlight{display:flex;flex-direction:column;min-height:0}
  .cv-highlight .codeblock{flex:1;min-height:0}

  .quiz{display:flex;flex-direction:column;gap:16px;height:100%;background:var(--sl-surface);
    border:1px solid var(--sl-border);border-radius:12px;padding:26px 30px;overflow:auto;box-shadow:var(--sl-shadow)}
  .quiz-top{display:flex;align-items:center;gap:10px}
  .quiz-badge{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--sl-primary);border:1.5px solid var(--sl-primary);padding:3px 11px;border-radius:999px}
  .quiz-timer{font-size:12px;color:var(--sl-muted);margin-left:auto;background:var(--sl-tag);
    border:1px solid var(--sl-border);padding:3px 10px;border-radius:999px}
  .quiz-q{margin:0;font-family:var(--sl-font-heading);font-size:24px;line-height:1.35;color:var(--sl-heading);font-weight:700}
  .quiz-options{display:flex;flex-direction:column;gap:10px}
  .quiz-opt{display:flex;align-items:flex-start;gap:14px;text-align:left;font:inherit;font-size:16px;line-height:1.45;
    color:var(--sl-text);background:var(--sl-surface-2);border:2px solid var(--sl-border);border-radius:10px;padding:13px 16px;cursor:pointer;transition:.15s}
  .quiz-opt:hover:not(:disabled){border-color:var(--sl-primary);background:var(--sl-primary-soft);transform:translateX(3px)}
  .quiz-opt:disabled{cursor:default}
  .quiz-opt .k{flex:0 0 26px;height:26px;border-radius:6px;background:var(--sl-tag);border:1px solid var(--sl-border);
    display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--sl-muted)}
  .quiz-opt.correct{border-color:#22c55e;background:var(--sl-correct-bg)}
  .quiz-opt.correct .k{background:#22c55e;color:#fff;border-color:#22c55e}
  .quiz-opt.wrong{border-color:#ef4444;background:var(--sl-wrong-bg)}
  .quiz-opt.wrong .k{background:#ef4444;color:#fff;border-color:#ef4444}
  .quiz-exp{background:var(--sl-primary-soft);border-left:4px solid var(--sl-primary);
    padding:13px 16px;border-radius:0 8px 8px 0;font-size:15px;line-height:1.6;color:var(--sl-primary-dark)}

  /* ═══════════════════════════════════════════════════════════
     BOTTOM NAV
     ═══════════════════════════════════════════════════════════ */
  .bottom-nav{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px 16px}
  .nav-btn{font:inherit;font-size:14px;font-weight:700;color:var(--sl-heading);
    background:var(--sl-surface);border:1px solid var(--sl-border);padding:10px 20px;border-radius:9px;cursor:pointer;transition:.15s;white-space:nowrap}
  .nav-btn:hover:not(:disabled){background:var(--sl-primary);color:#fff;border-color:var(--sl-primary)}
  .nav-btn:disabled{opacity:.4;cursor:not-allowed}
  .progress{flex:1;height:5px;background:var(--sl-border);border-radius:99px;overflow:hidden}
  .progress-bar{height:100%;width:0;background:var(--sl-primary);border-radius:99px;transition:width .25s}

  /* ═══════════════════════════════════════════════════════════
     DRAWER
     ═══════════════════════════════════════════════════════════ */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .drawer-backdrop.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:390px;max-width:92vw;background:var(--sl-surface);
    box-shadow:-14px 0 40px rgba(0,0,0,.3);transform:translateX(102%);transition:transform .25s ease;z-index:50;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .drawer h2{margin:0;padding:20px 22px 14px;font-size:16px;color:var(--sl-heading);border-bottom:1px solid var(--sl-border);font-family:var(--sl-font-heading)}
  .drawer ol{margin:0;padding:10px;list-style:none;overflow:auto;flex:1}
  .drawer li button{display:flex;gap:12px;width:100%;text-align:left;font:inherit;font-size:14px;line-height:1.4;
    color:var(--sl-text);background:none;border:none;padding:10px 12px;border-radius:8px;cursor:pointer}
  .drawer li button:hover{background:var(--sl-tag)}
  .drawer li button.active{background:var(--sl-primary-soft);color:var(--sl-primary-dark);font-weight:700}
  .drawer li button .n{flex:0 0 26px;font-size:11px;font-weight:700;color:var(--sl-muted);
    background:var(--sl-tag);border:1px solid var(--sl-border);border-radius:5px;height:20px;display:grid;place-items:center;margin-top:1px}
  .drawer li.chapter button{font-weight:800;color:var(--sl-heading)}
  .drawer li.chapter button .n{background:var(--sl-primary);color:#fff;border-color:var(--sl-primary)}

  /* ═══════════════════════════════════════════════════════════
     RESPONSIVE
     ═══════════════════════════════════════════════════════════ */
  @media (max-width:900px){
    .nav-menu{gap:2px}
    .nav-logo{font-size:14px}
    .nav-logo img{height:30px}
  }
  @media (max-width:820px){
    .slide-body{padding:26px 22px 18px}
    .s-chapter{padding:40px 32px}
    .s-chapter::after{left:32px;bottom:50px}
    .brand span:last-child{display:none}
    #stage{padding:8px}

    .navbar{padding:0 12px}
    .nav-container{gap:8px}
    .nav-logo{font-size:13px;gap:8px}
    .nav-logo img{height:26px}

    .nav-toggle{display:flex}

    .nav-menu{
      position:absolute;
      top:64px;
      left:0;right:0;
      flex-direction:column;
      align-items:stretch;
      gap:4px;
      padding:0 12px;
      background:var(--sl-surface);
      border-bottom:1px solid var(--sl-border);
      box-shadow:0 12px 28px rgba(0,0,0,.28);
      max-height:0;
      overflow:hidden;
      transition:max-height .3s ease, padding .3s ease;
      z-index:29;
    }
    .nav-menu.open{
      max-height:80vh;
      padding:12px;
      overflow:auto;
    }

    .nav-link,.dropbtn{
      width:100%;
      justify-content:space-between;
      padding:12px 14px;
      font-size:15px;
    }

    .dropdown:hover .arrow{transform:none}
    .dropdown:hover .dropdown-content,
    .dropdown:focus-within .dropdown-content{display:none}

    .dropdown-content{
      position:static;
      display:none;
      min-width:0;
      margin:4px 0 0;
      padding:4px;
      background:var(--sl-tag);
      border:1px solid var(--sl-border);
      box-shadow:none;
    }
    .dropdown.open .dropdown-content{display:block}
    .dropdown.open .arrow{transform:rotate(180deg)}

    .theme-toggle{align-self:flex-start;margin:6px 0 0}
  }
  @media (max-width:420px){
    .nav-logo{font-size:12px}
    .nav-logo img{height:22px}
    .nav-logo span{max-width:170px}
  }

          { "id":"t11","type":"text","x":60,"y":150,"w":1160,"h":470,"z":2,
            "data":{"html":"<p>Deux propriétés booléennes à combiner :</p><ul><li><code>radioFemme.checked</code> - vrai si le bouton radio « Femme » est sélectionné</li><li><code>checkboxMarie.checked</code> - vrai si la case « Marié(e) » est cochée</li></ul><p style=\"margin-top:12px\">Condition : <code>if (radioFemme.checked &amp;&amp; checkboxMarie.checked)</code> → <code>champ.readOnly = false</code> (déverrouillé), sinon <code>readOnly = true</code> ET on vide le champ (<code>value = \"\"</code>) pour ne pas garder une ancienne saisie invalide.</p>"},

      { "type":"code", "title":"Exercice 6 - Corrigé", "language":"html",

      { "type":"canvas", "elements":[

              "options":["Rien, le champ reste débloqué","Le champ redevient readOnly ET se vide (value = \"\")","Le champ redevient readOnly mais garde sa valeur","Une erreur JavaScript"],
              "answer":1,"duration":20,
              "explanation":"Le bloc else fait les deux choses : readOnly = true ET value = \"\" - sinon une valeur invalide resterait affichée alors que le champ n'est plus censé être rempli."}} ] },
      { "type":"chapter","title":"Exercice 7","subtitle":"Rechercher une planète (fichier externe)" },
      { "type":"bullets","title":"Exercice 7 - Énoncé",
        "items":[
          "Avec les données d'un tableau de planètes (distance au Soleil, diamètre), permettez à l'utilisateur de saisir un nom de planète et d'afficher ses caractéristiques au clic sur un bouton",

      { "type":"canvas", "elements":[

          { "id":"r13","type":"shape","x":60,"y":112,"w":170,"h":5,"z":3,
            "data":{"shape":"rect"},"style":{"fill":"var(--sl-accent)","opacity":1,"stroke":"none"}},
          { "id":"t13","type":"text","x":60,"y":150,"w":1160,"h":470,"z":2,
            "data":{"html":"<p><b>Fichier externe :</b> <code>&lt;script src=\"TD3Ex7.js\"&gt;&lt;/script&gt;</code> - le fichier .js ne contient QUE du JavaScript, sans balise <code>&lt;script&gt;</code>.</p><p style=\"margin-top:12px\"><b>Tableaux parallèles :</b> <code>arrPlanete[i]</code>, <code>arrDistance[i]</code> et <code>arrDiametre[i]</code> décrivent la même planète au même index <code>i</code>.</p><p style=\"margin-top:12px\"><b>Insensible à la casse :</b> comparer <code>nom.toUpperCase()</code> des deux côtés, pas le texte brut.</p>"},
            "style":{"fontSize":18,"color":"var(--sl-text)","lineHeight":1.6}} ] },
      { "type":"canvas", "elements":[
          { "id":"h14","type":"heading","x":60,"y":36,"w":1160,"h":60,"z":3,
            "data":{"text":"Exercice 7 - Élément de correction (logique de recherche)"},
            "style":{"fontSize":34,"fontWeight":800,"color":"var(--sl-heading)","fontFamily":"var(--sl-font-heading)"}},
          { "id":"r14","type":"shape","x":60,"y":112,"w":170,"h":5,"z":3,
            "data":{"shape":"rect"},"style":{"fill":"var(--sl-accent)","opacity":1,"stroke":"none"}},

            "data":{"language":"javascript",
              "code":"function chercherPlanete(nomSaisi) {\n  var arrPlanete = [\"Mercure\", \"Venus\", \"Terre\", \"Mars\"];\n  var arrDistance = [36000000, 67000000, 93000000, 141000000];\n  var arrDiametre = [3100, 7700, 7920, 4200];\n  var i = 0, trouve = false, resultat = null;\n  while (!trouve && i < arrPlanete.length) {\n    if (arrPlanete[i].toUpperCase() === nomSaisi.toUpperCase()) {\n      resultat = { distance: arrDistance[i], diametre: arrDiametre[i] };\n      trouve = true;\n    }\n    i++;\n  }\n  return resultat;\n}\n\nconsole.log(chercherPlanete(\"mars\"));\nconsole.log(chercherPlanete(\"pluton\"));"}},
          { "id":"t14","type":"text","x":912,"y":152,"w":310,"h":468,"z":2,
            "data":{"html":"<p style=\"font-weight:800;color:var(--sl-heading);font-size:17px;margin:0 0 10px\">Dans la vraie page</p><p>La fonction <code>affiche()</code> du corrigé lit le champ input, appelle cette recherche, puis écrit le résultat dans 2 autres champs (readonly).</p><p style=\"color:var(--sl-muted);font-size:13px;margin:14px 0 0\">▶ Exécuter, essayer d'autres noms.</p>"},
            "style":{"fontSize":15,"color":"var(--sl-text)","lineHeight":1.6}} ] },

        "code":"function verifNomPlanete(nom1, nom2) {\n  if (nom1 != nom2) return false;\n  else return true;\n}\nfunction affiche() {\n  var nomPlanete = document.getElementById(\"planete\").value;\n  var i = 0;\n  var arrPlanete = new Array(\"Mercure\", \"Venus\", \"Terre\", \"Mars\");\n  var arrDistance = new Array(36000000, 67000000, 93000000, 141000000);\n  var arrDiametre = new Array(3100, 7700, 7920, 4200);\n  var trouve = false;\n  while (!trouve && i < arrPlanete.length) {\n    if (verifNomPlanete(arrPlanete[i].toUpperCase(), nomPlanete.toUpperCase())) {\n      document.getElementById(\"distance\").value = arrDistance[i];\n      document.getElementById(\"diametre\").value = arrDiametre[i];\n      trouve = true;\n    }\n    i++;\n  }\n  if (!trouve) alert(\"Votre planete n'est pas dans la liste !\");\n}" },
      { "type":"canvas", "elements":[

              "options":["Pour accélérer la recherche","Pour rendre la comparaison insensible à la casse (majuscules/minuscules)","toUpperCase() est obligatoire avant un ===","Pour éviter une erreur de syntaxe"],
              "answer":1,"duration":20,
              "explanation":"\"Mars\" et \"mars\" sont des chaînes différentes pour ===. En mettant les deux en majuscules avant de comparer, la casse saisie par l'utilisateur n'a plus d'importance."}} ] },

        "items":[
          "<code>element.style.xxx</code> pour changer un style, <code>element.value</code> pour lire/écrire un champ",

          "Permuter deux valeurs = toujours passer par une variable temporaire",

<script>
(function () {
  "use strict";

  var deck;
  try {
    deck = JSON.parse(document.getElementById("deck").textContent);
  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div class="slide"><div class="slide-body">' +
      '<h2 style="color:#c00">Erreur de lecture du JSON</h2>' +
      '<pre style="white-space:pre-wrap;background:var(--sl-tag);padding:12px;border-radius:6px">' +
      String(e && e.message ? e.message : e) + "</pre></div></div>";
    return;
  }

  var slides = deck.deck.slides;
  var current = 0;
  var chapterNumbers = {};
  (function () {
    var n = 0;
    slides.forEach(function (s, i) {
      if (s.type === "chapter") { n++; chapterNumbers[i] = n; }
    });
  })();

  var SAFE_TAGS = /^<\/?(?:a|b|i|em|strong|br|code|pre|span|p|ul|ol|li|small|sub|sup|u|div|h[1-6])(?:\s[^<>]*)?\/?>/i;
  function safeHtml(s){
    if (s == null) return "";
    s = String(s);
    var out = "";
    for (var i = 0; i < s.length; i++){
      var c = s[i];
      if (c === "<"){
        var m = s.slice(i).match(SAFE_TAGS);
        if (m){ out += m[0]; i += m[0].length - 1; continue; }
        out += "&lt;";
      } else if (c === ">"){
        out += "&gt;";
      } else if (c === "&"){
        var e = s.slice(i).match(/^&(?:[a-zA-Z]+|#\d+|#x[0-9a-fA-F]+);/);
        if (e){ out += e[0]; i += e[0].length - 1; } else { out += "&amp;"; }
      } else {
        out += c;
      }
    }
    return out;
  }
  function escapeHtml(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function highlight(code, lang){
    var esc = escapeHtml(code);
    lang = (lang || "").toLowerCase();
    if (lang === "html" || lang === "xml"){
      esc = esc.replace(/([\w-]+)=("[^"]*")/g, function(_,a,v){
        return '<span class="tok-attr">' + a + '</span>=<span class="tok-str">' + v + '</span>';
      });
      esc = esc.replace(/(&lt;\/?)([a-zA-Z][\w-]*)/g, function(_,br,name){
        return br + '<span class="tok-tag">' + name + '</span>';
      });
      esc = esc.replace(/(&lt;!--[\s\S]*?--&gt;)/g, '<span class="tok-com">$1</span>');
      return esc;
    }
    return esc.replace(
      /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(function|var|let|const|if|else|for|while|do|return|new|true|false|null|undefined|typeof|break|continue|switch|case|default|this|in|of)\b|\b(document|window|console|alert|Math|Array|String|Number|Object)\b|\b(\d+(?:\.\d+)?)\b/g,
      function (m, com, str, kw, glob, num){
        if (com) return '<span class="tok-com">' + com + "</span>";
        if (str) return '<span class="tok-str">' + str + "</span>";
        if (kw)  return '<span class="tok-kw">'  + kw  + "</span>";
        if (glob) return '<span class="tok-glob">' + glob + "</span>";
        if (num) return '<span class="tok-num">' + num + "</span>";
        return m;
      }
    );
  }

  var UNITLESS = { opacity:1, zIndex:1, fontWeight:1, lineHeight:1, order:1, flexGrow:1, zoom:1 };
  function applyStyle(node, style){
    if (!style) return;
    Object.keys(style).forEach(function(k){
      var v = style[k];
      if (v === undefined || v === null || v === "") return;
      if (k === "fill"){ node.style.background = v; return; }
      if (k === "stroke"){ if (v !== "none") node.style.border = v; return; }
      var cssK = k.replace(/[A-Z]/g, function(m){ return "-" + m.toLowerCase(); });
      if (UNITLESS[k]) node.style.setProperty(cssK, String(v));
      else node.style.setProperty(cssK, typeof v === "number" ? v + "px" : v);
    });
  }

  function codeBlock(lang, code, label){
    var wrap = document.createElement("div");
    wrap.className = "codeblock";
    var head = document.createElement("div");
    head.className = "code-head";
    head.innerHTML = '<span class="lang">' + escapeHtml((lang || "code").toUpperCase()) + "</span>" +
      (label ? '<span class="label">' + escapeHtml(label) + "</span>" : "");
    var pre = document.createElement("pre");
    var lines = String(code).split("\n");
    var html = "";
    lines.forEach(function(line, i){
      html += '<span class="code-row"><span class="ln">' + (i + 1) +
              '</span><span class="lc">' + (highlight(line, lang) || " ") + '</span></span>';
    });
    pre.innerHTML = html;
    wrap.appendChild(head);
    wrap.appendChild(pre);
    return wrap;
  }

  function renderQuiz(d){
    var box = document.createElement("div"); box.className = "quiz";
    var top = document.createElement("div"); top.className = "quiz-top";
    top.innerHTML = '<span class="quiz-badge">Quiz</span>' +
      '<span class="quiz-timer">⏱ ' + (d.duration || 20) + " s</span>";
    var q = document.createElement("h3"); q.className = "quiz-q"; q.innerHTML = safeHtml(d.question);
    var opts = document.createElement("div"); opts.className = "quiz-options";
    var exp = document.createElement("div"); exp.className = "quiz-exp"; exp.hidden = true;
    exp.innerHTML = safeHtml(d.explanation || "");
    var answered = false;
    (d.options || []).forEach(function(text, i){
      var b = document.createElement("button"); b.className = "quiz-opt";
      b.innerHTML = '<span class="k">' + "ABCD".charAt(i) + '</span><span class="t">' + safeHtml(text) + "</span>";
      b.addEventListener("click", function(){
        if (answered) return; answered = true;
        Array.prototype.forEach.call(opts.children, function(btn, j){
          btn.disabled = true;
          if (j === d.answer) btn.classList.add("correct");
        });
        if (i !== d.answer) b.classList.add("wrong");
        exp.hidden = false;
      });
      opts.appendChild(b);
    });
    box.appendChild(top); box.appendChild(q); box.appendChild(opts); box.appendChild(exp);
    return box;
  }

  function renderCodeLive(d){
    var box = document.createElement("div");
    box.style.cssText = "display:flex;flex-direction:column;height:100%;min-height:0";
    var wrap = document.createElement("div"); wrap.className = "codeblock";
    wrap.style.cssText = "flex:1;min-height:0";
    var head = document.createElement("div"); head.className = "code-head";
    head.innerHTML = '<span class="lang">' + escapeHtml((d.language || "js").toUpperCase()) + '</span>';
    var btn = document.createElement("button"); btn.className = "run-btn"; btn.textContent = "▶ Exécuter";
    head.appendChild(btn);
    var pre = document.createElement("pre");
    var lines = String(d.code).split("\n"); var html = "";
    lines.forEach(function(line, i){
      html += '<span class="code-row"><span class="ln">' + (i + 1) +
              '</span><span class="lc">' + (highlight(line, d.language) || " ") + '</span></span>';
    });
    pre.innerHTML = html;
    wrap.appendChild(head); wrap.appendChild(pre);
    var out = document.createElement("pre"); out.className = "run-out";
    out.textContent = "Sortie console — cliquez sur ▶ Exécuter";
    btn.addEventListener("click", function(){
      var logs = []; var orig = console.log;
      console.log = function(){
        var parts = Array.prototype.map.call(arguments, function(a){
          if (a === null) return "null";
          if (typeof a === "object"){ try { return JSON.stringify(a); } catch(e){ return String(a); } }
          return String(a);
        });
        logs.push(parts.join(" "));
      };
      try { new Function(d.code)(); }
      catch (err){ logs.push("⚠ " + err.name + " : " + err.message); }
      console.log = orig;
      out.textContent = logs.length ? logs.join("\n") : "(aucune sortie)";
    });
    box.appendChild(wrap); box.appendChild(out);
    return box;
  }

  function renderCanvasElement(e){
    var d = e.data || {};
    var node = null;
    switch (e.type){
      case "heading": node = document.createElement("div"); node.className = "cv-heading";
        node.innerHTML = safeHtml(d.text || d.html || ""); break;
      case "shape": node = document.createElement("div"); node.className = "cv-shape"; break;
      case "text": node = document.createElement("div"); node.className = "cv-text";
        node.innerHTML = safeHtml(d.html || d.text || ""); break;
      case "highlight": node = document.createElement("div"); node.className = "cv-highlight";
        node.appendChild(codeBlock(d.language, d.code || "", d.label)); break;
      case "quiz-live": node = renderQuiz(d); break;
      case "code-live": node = renderCodeLive(d); break;
      default: node = document.createElement("div"); node.className = "cv-text";
        node.innerHTML = safeHtml(d.html || d.text || "");
    }
    node.style.position = "absolute";
    node.style.left = e.x + "px"; node.style.top = e.y + "px";
    node.style.width = e.w + "px"; node.style.height = e.h + "px";
    node.style.zIndex = e.z || 1; node.style.overflow = "hidden";
    applyStyle(node, e.style);
    return node;
  }

  function renderSlide(s, pageNum, chapNum){
    var slide = document.createElement("section");
    slide.className = "slide";
    var body;

    if (s.type === "title"){
      body = document.createElement("div"); body.className = "s-title";
      var html = "";
      if (s.eyebrow) html += '<div class="eyebrow">' + safeHtml(s.eyebrow) + "</div>";
      html += "<h1>" + safeHtml(s.title) + "</h1>";
      if (s.subtitle) html += '<p class="sub">' + safeHtml(s.subtitle) + "</p>";
      var meta = [];
      if (s.author) meta.push("<span>" + safeHtml(s.author) + "</span>");
      if (s.date)   meta.push("<span>" + safeHtml(s.date)   + "</span>");
      if (meta.length) html += '<div class="meta">' + meta.join("") + "</div>";
      body.innerHTML = html;
      slide.appendChild(body);
    }
    else if (s.type === "chapter"){
      body = document.createElement("div"); body.className = "s-chapter";
      var num = String(chapNum || 1).padStart(2, "0");
      body.innerHTML = '<div class="chapter-num">' + num + '</div>' +
        "<h2>" + safeHtml(s.title) + "</h2>" +
        (s.subtitle ? "<p>" + safeHtml(s.subtitle) + "</p>" : "");
      slide.appendChild(body);
    }
    else if (s.type === "bullets"){
      body = document.createElement("div"); body.className = "slide-body";
      var h = '<h2 class="title">' + safeHtml(s.title) + '</h2><div class="rule"></div><ul class="bullets">';
      (s.items || []).forEach(function(it){
        if (typeof it === "string") h += "<li>" + safeHtml(it) + "</li>";
        else {
          h += "<li>" + safeHtml(it.text || "");
          if (it.sub && it.sub.length){
            h += "<ul>";
            it.sub.forEach(function(sub){ h += "<li>" + safeHtml(sub) + "</li>"; });
            h += "</ul>";
          }
          h += "</li>";
        }
      });
      h += "</ul>";
      if (s.note) h += '<div class="note">' + safeHtml(s.note) + "</div>";
      body.innerHTML = h; slide.appendChild(body);
    }
    else if (s.type === "code"){
      body = document.createElement("div"); body.className = "slide-body";
      body.style.display = "flex"; body.style.flexDirection = "column";
      var hd = document.createElement("div");
      hd.innerHTML = '<h2 class="title">' + safeHtml(s.title) + '</h2><div class="rule"></div>';
      body.appendChild(hd);
      var cb = codeBlock(s.language, s.code);
      cb.style.flex = "1"; cb.style.minHeight = "0";
      body.appendChild(cb); slide.appendChild(body);
    }
    else if (s.type === "canvas"){
      var wrap = document.createElement("div"); wrap.className = "canvas-wrap";
      var stage = document.createElement("div"); stage.className = "canvas-stage";
      (s.elements || []).forEach(function(e){ stage.appendChild(renderCanvasElement(e)); });
      wrap.appendChild(stage); slide.appendChild(wrap);
      var fit = function(){
        var w = wrap.clientWidth, hgt = wrap.clientHeight;
        if (!w || !hgt) return;
        var sc = Math.min(w / 1280, hgt / 720);
        stage.style.transform = "scale(" + sc + ")";
      };
      if (window.ResizeObserver) new ResizeObserver(fit).observe(wrap);
      else window.addEventListener("resize", fit);
      requestAnimationFrame(fit); setTimeout(fit, 40);
    }
    else {
      body = document.createElement("div"); body.className = "slide-body";
      body.innerHTML = '<h2 class="title">' + safeHtml(s.title || s.type) + '</h2><div class="rule"></div><pre>' +
        escapeHtml(JSON.stringify(s, null, 2)) + '</pre>';
      slide.appendChild(body);
    }

    var footer = document.createElement("div"); footer.className = "slide-footer";
    footer.innerHTML = '<span>' + escapeHtml(deck.deck.footerText || "TD3 - Programmation Web front-end") +
                       '</span><span class="pg">' + pageNum + '</span>';
    slide.appendChild(footer);
    return slide;
  }

  var stage = document.getElementById("stage");
  var counter = document.getElementById("counter");
  var bar = document.getElementById("progressBar");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function goTo(i){
    current = Math.max(0, Math.min(slides.length - 1, i));
    stage.innerHTML = "";
    stage.appendChild(renderSlide(slides[current], current + 1, chapterNumbers[current]));
    counter.textContent = (current + 1) + " / " + slides.length;
    bar.style.width = ((current + 1) / slides.length * 100) + "%";
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === slides.length - 1;
    highlightToc();
    try { history.replaceState(null, "", "#s" + (current + 1)); } catch(e){}
  }

  prevBtn.addEventListener("click", function(){ goTo(current - 1); });
  nextBtn.addEventListener("click", function(){ goTo(current + 1); });

  document.addEventListener("keydown", function(ev){
    if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
    if (ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " "){ ev.preventDefault(); goTo(current + 1); }
    else if (ev.key === "ArrowLeft" || ev.key === "PageUp"){ ev.preventDefault(); goTo(current - 1); }
    else if (ev.key === "Home"){ goTo(0); }
    else if (ev.key === "End"){ goTo(slides.length - 1); }
    else if (ev.key === "s" || ev.key === "S"){ toggleDrawer(); }
    else if (ev.key === "Escape"){ closeDrawer(); }
  });

  var drawer = document.getElementById("drawer");
  var backdrop = document.getElementById("backdrop");
  var tocList = document.getElementById("tocList");
  var tocBtn = document.getElementById("tocBtn");

  function slideLabel(s){
    if (s.type === "canvas"){
      var h = (s.elements || []).filter(function(e){ return e.type === "heading"; })[0];
      return h ? (h.data.text || h.data.html || "Diapositive") : "Diapositive";
    }
    if (s.type === "chapter") return s.title + (s.subtitle ? " — " + s.subtitle : "");
    if (s.type === "title") return s.title;
    return s.title || "Diapositive";
  }

  slides.forEach(function(s, i){
    var li = document.createElement("li");
    if (s.type === "chapter") li.className = "chapter";
    var b = document.createElement("button");
    b.innerHTML = '<span class="n">' + (i + 1) + '</span><span>' + safeHtml(slideLabel(s)) + "</span>";
    b.addEventListener("click", function(){ goTo(i); closeDrawer(); });
    li.appendChild(b); tocList.appendChild(li);
  });

  function highlightToc(){
    Array.prototype.forEach.call(tocList.children, function(li, i){
      li.firstChild.classList.toggle("active", i === current);
    });
    var act = tocList.querySelector("button.active");
    if (act && drawer.classList.contains("open")) act.scrollIntoView({ block: "nearest" });
  }
  function openDrawer(){ drawer.classList.add("open"); backdrop.classList.add("open"); highlightToc(); }
  function closeDrawer(){ drawer.classList.remove("open"); backdrop.classList.remove("open"); }
  function toggleDrawer(){ drawer.classList.contains("open") ? closeDrawer() : openDrawer(); }

  tocBtn.addEventListener("click", toggleDrawer);
  backdrop.addEventListener("click", closeDrawer);

  var start = 0;
  var m = /#s(\d+)/.exec(location.hash);
  if (m) start = Math.min(slides.length - 1, Math.max(0, parseInt(m[1], 10) - 1));
  goTo(start);
})();
</script>

<!-- ═══════════════════════════════════════════════════════════
     THEME TOGGLE
     ═══════════════════════════════════════════════════════════ -->
<script>
  (function () {
    const themeToggle = document.getElementById('theme-toggle');
    const root = document.documentElement;
    const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
    const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;

    const currentTheme = localStorage.getItem('theme') || 'dark';
    if (currentTheme === 'light') {
      root.setAttribute('data-theme', 'light');
      themeToggle.innerHTML = moonIcon;
    } else {
      root.removeAttribute('data-theme');
      themeToggle.innerHTML = sunIcon;
    }

    themeToggle.addEventListener('click', () => {
      if (root.hasAttribute('data-theme')) {
        root.removeAttribute('data-theme');
        localStorage.setItem('theme', 'dark');
        themeToggle.innerHTML = sunIcon;
      } else {
        root.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        themeToggle.innerHTML = moonIcon;
      }
    });
  })();
</script>

<!-- ═══════════════════════════════════════════════════════════
     MOBILE NAV TOGGLE
     ═══════════════════════════════════════════════════════════ -->
<script>
  (function () {
    var navToggle = document.getElementById('nav-toggle');
    var navMenu   = document.getElementById('nav-menu');
    if (!navToggle || !navMenu) return;

    // Open / close the mobile panel
    navToggle.addEventListener('click', function () {
      var open = navMenu.classList.toggle('open');
      navToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    // On mobile, tapping "L1 ▾" / "L2 ▾" opens the submenu instead of navigating
    document.querySelectorAll('.dropdown .dropbtn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        if (window.matchMedia('(max-width:820px)').matches) {
          e.preventDefault();
          btn.closest('.dropdown').classList.toggle('open');
        }
      });
    });

    // Close the panel when the viewport grows back to desktop
    var mq = window.matchMedia('(max-width:820px)');
    var onChange = function () {
      if (!mq.matches) {
        navMenu.classList.remove('open');
        navToggle.setAttribute('aria-expanded', 'false');
        document.querySelectorAll('.dropdown.open').forEach(function (d) {
          d.classList.remove('open');
        });
      }
    };
    mq.addEventListener ? mq.addEventListener('change', onChange) : mq.addListener(onChange);
  })();
</script>
